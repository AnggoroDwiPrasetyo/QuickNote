<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List (Capstone Project)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css"> 

</head>
<body>
    <main>
        <div id="waktu-container">
            <div id="tampilan-tanggal"></div>
            <div id="tampilan-jam"></div>

        <h1>To-Do List Saya Hari Ini</h1>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Apa yang ingin Anda kerjakan?" required>
            <button type="submit">Tambah</button>
        </form>

        <ul id="todo-list">
            </ul>
    </main>

    <script src="app.js"></script>
</body>
